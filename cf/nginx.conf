# 容器里的 Nginx：监听 8080（和 Container 的 defaultPort 对上），跑 /var/www/html。
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 50m;

    # 数据目录禁止从网址访问（Apache 下靠 .htaccess，这里必须在 Nginx 里拦）
    location ^~ /data/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}
